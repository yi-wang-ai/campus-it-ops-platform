name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Python tests and coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: Compile Python
        run: python -m compileall -q app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript webhook tests
        run: node scripts/test-webhook.cjs
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ansible-core>=2.16,<2.21'
      - run: ansible-playbook -i ansible/inventory.ini.example ansible/recover-nginx.yml --syntax-check
