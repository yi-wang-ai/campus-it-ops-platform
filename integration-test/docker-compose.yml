## Full Zabbix → IT Ops → Ansible integration lab (single-machine Docker)
##
## Components:
##   zabbix-db       — PostgreSQL backend for Zabbix
##   zabbix-server   — Zabbix server with webhook media type
##   zabbix-web      — Zabbix web frontend (API access for configuration)
##   target          — Ubuntu container running nginx + sshd + Zabbix agent2
##   api             — Campus IT Ops FastAPI app
##
## Usage:
##   cd integration-test
##   docker compose up -d --build
##   bash run-integration.sh
##   docker compose down -v

services:
  zabbix-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab-pass
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 5s
      timeout: 3s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-ubuntu-latest
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab-pass
      POSTGRES_DB: zabbix
      ZBX_STARTPOLLERS: "2"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
    ports:
      - "127.0.0.1:10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-ubuntu-latest
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab-pass
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api_jsonrpc.php -d '{\"jsonrpc\":\"2.0\",\"method\":\"apiinfo.version\",\"id\":1,\"params\":{}}' -H 'Content-Type: application/json' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  target:
    build:
      context: .
      dockerfile: Dockerfile.target
    hostname: lab-target
    ports:
      - "127.0.0.1:2222:22"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/incidents.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - incident_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  zabbix_pgdata:
  incident_data:
