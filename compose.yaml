services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/incidents.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - incident_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  incident_data:
